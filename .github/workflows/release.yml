name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test --manifest-path protocol/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match version $version in src-tauri/Cargo.toml"
          }
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if (-not $config.plugins.updater.pubkey) {
            throw "Set plugins.updater.pubkey in src-tauri/tauri.conf.json"
          }
          if (-not "${{ vars.ATLAS_SERVER_URL }}") {
            throw "Set the ATLAS_SERVER_URL repository variable"
          }

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ATLAS_SERVER_URL: ${{ vars.ATLAS_SERVER_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Atlas ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json

  # The build runs beside the tests, so a draft can exist before they finish: it goes
  # when they or the build didn't pass, so only a tested build is left to publish.
  discard:
    needs: [test, windows]
    if: ${{ always() && (needs.test.result != 'success' || needs.windows.result != 'success') }}
    runs-on: ubuntu-latest
    steps:
      - run: gh release delete "${{ github.ref_name }}" --yes --repo "${{ github.repository }}" || echo "No draft to delete."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
