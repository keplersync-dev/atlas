name: Mac test build

on:
  push:
    tags: ["mac-test-*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Test
        run: |
          set +e
          status=0
          for crate in protocol src-tauri; do
            cargo test --manifest-path $crate/Cargo.toml 2>&1 | tee -a test.log
            [ "${PIPESTATUS[0]}" -ne 0 ] && status=1
          done
          grep -E -A3 "panicked at" test.log | grep -v '^--$' | head -40 | while read -r line; do echo "::error::$line"; done
          grep -E "^test .* FAILED" test.log | head -20 | while read -r line; do echo "::error::$line"; done
          exit $status

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATLAS_SERVER_URL: ${{ vars.ATLAS_SERVER_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Atlas Mac test ${{ github.ref_name }}
          releaseBody: A test build for macOS. Not an update; nothing installed gets it.
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: false
          args: --target universal-apple-darwin
