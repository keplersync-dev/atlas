[package]
name = "atlas"
version = "0.1.0"
description = "Keep Minecraft modpacks in sync with friends, alongside the launcher you already use"
authors = ["keplerHaloxx"]
license = "GPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.0", features = ["sync", "time", "macros", "rt"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
uuid = { version = "1.28.0", features = ["v7"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
dunce = "1.0.5"
sha1 = "0.11.0"
sha2 = "0.11.1"
hex = "0.4.3"
notify-debouncer-full = "0.7.0"
sysinfo = "0.39.6"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
toml = "1.1.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "query"] }
base64 = "0.23.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
dunce = "1.0.5"
regex = "1.13.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri = { version = "2", features = ["test"] }
